storage: ./storage
auth:
  htpasswd:
    file: ./htpasswd
uplinks:
  npmFeed:
    url: https://packagefeedproxy.microsoft.io/npm/
    max_fails: 40
    maxage: 30m
    timeout: 60s
    fail_timeout: 10m
    cache: false
    agent_options:
      keepAlive: true
      maxSockets: 40
      maxFreeSockets: 10
publish:
  allow_offline: true
packages:
  '@*/*':
    access: $all
    publish: $all
    proxy: npmFeed
  '**':
    access: $all
    publish: $all
    proxy: npmFeed
logs:
  - {type: file, path: verdaccio.log, format: pretty, level: debug}
