storage: ./storage
auth:
  htpasswd:
    file: ./htpasswd
uplinks:
  npmjs:
    # Azure Artifacts (CFS) feed, which upstreams to npmjs.org. Verdaccio must not
    # reach registry.npmjs.org directly. The token is injected by verdaccio-start.yml.
    url: https://pkgs.dev.azure.com/ms/react-native/_packaging/react-native-public/npm/registry/
    auth:
      type: bearer
      token_env: NPM_FEED_AUTH_TOKEN
    max_fails: 40
    maxage: 30m
    timeout: 60s
    fail_timeout: 10m
    cache: false
    agent_options:
      keepAlive: true
      maxSockets: 40
      maxFreeSockets: 10
packages:
  '@*/*':
    access: $all
    publish: $all
    proxy: npmjs
  '**':
    access: $all
    publish: $all
    proxy: npmjs
logs:
  - {type: file, path: verdaccio.log, format: pretty, level: debug}
