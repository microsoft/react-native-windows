variables:
  # Enables `chalk` to show colored output to Azure Pipelines
  FORCE_COLOR: 3

  # Automatically fails `npx` prompts to use networked version
  NPM_CONFIG_YES: false
  NPM_CONFIG_CACHE: $(Agent.TempDirectory)/.npmCache

  # Pull-request builds do not have a feed token, so use the anonymous proxy by default.
  # Continuous builds switch to the authenticated feed in auth-npm-feed.yml.
  NPM_CONFIG_REGISTRY: https://packagefeedproxy.microsoft.io/npm/
  YARN_NPM_REGISTRY_SERVER: https://packagefeedproxy.microsoft.io/npm/

  # Stop React Native DevTools from fetching its standalone shell binary via DotSlash from a
  # Facebook CDN on dev-server start, which is blocked under network isolation. The 'dev'
  # flavor skips that download; the debugger is never opened in CI, so this has no effect on tests.
  RNDT_DEV: 1

  # NuGet Config
  NUGET_ENABLE_EXPERIMENTAL_HTTP_RETRY: true
  NUGET_PACKAGES: $(Agent.TempDirectory)/.nuget/packages
  NUGET_PLUGIN_HANDSHAKE_TIMEOUT_IN_SECONDS: 60
  NUGET_PLUGIN_REQUEST_TIMEOUT_IN_SECONDS: 60

  # Guardian Config
  GDN_DOTNET_INSTALL: false
  GDN_SUPPRESS_FORKED_BUILD_WARNING: true
