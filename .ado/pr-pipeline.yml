#
# The PR pipeline entry point.
# Extends build-template.yml with buildEnvironment: PullRequest for Unofficial validation builds.
#

name: $(Date:yyyyMMdd).$(Rev:r)

trigger: none

pr:
  # Supported branches
  - main
  - '0.81-stable'
  - '0.83-stable'
  - '0.84-stable'
  - '0.85-stable'
  - '0.86-stable'
  - '0.87-stable'

variables:
  - group: platform-override-zero-permission-token

resources:
  repositories:
  # PR runs in the public project, which can't reach OfficePipelineTemplates; use the general 1ES templates.
  - repository: PipelineTemplates
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release

extends:
  template: build-template.yml@self
  parameters:
    buildEnvironment: PullRequest
    AgentPool:
      Medium:
        name: rnw-pool-4
        demands: ImageOverride -equals rnw-img-vs2026-node24
      Large:
        name: rnw-pool-8
        demands: ImageOverride -equals rnw-img-vs2026-node24
