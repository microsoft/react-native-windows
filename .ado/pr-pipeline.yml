#
# The PR pipeline entry point.
# Extends build-template.yml with buildEnvironment: PullRequest for Unofficial validation builds.
#

name: $(Date:yyyyMMdd).$(Rev:r)

trigger: none

pr:
  - main
  - master
  - "*-stable"

variables:
  - group: platform-override-zero-permission-token
  # Public PR agents acquire the bootstrap toolset through this feed when npmjs policy blocks midgard-yarn.
  - name: RNW_BOOTSTRAP_NPM_REGISTRY
    value: https://pkgs.dev.azure.com/ms/react-native/_packaging/react-native-public/npm/registry/

extends:
  template: build-template.yml@self
  parameters:
    buildEnvironment: PullRequest
    AgentPool:
      Medium:
        name: rnw-pool-4
        demands: ImageOverride -equals rnw-img-vs2026-node24
      Large:
        name: rnw-pool-8
        demands: ImageOverride -equals rnw-img-vs2026-node24
