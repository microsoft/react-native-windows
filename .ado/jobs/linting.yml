parameters:
  - name: buildEnvironment
    type: string
    default : PullRequest
    values:
      - PullRequest
      - Continuous

  - name: AgentPool
    type: object

jobs:
  - job: Linting
    displayName: Linting
    timeoutInMinutes: 40
    variables: [template: ../variables/windows.yml]
    pool: ${{ parameters.AgentPool.Medium }}
    steps:
      - ${{ if eq(parameters.buildEnvironment, 'Continuous') }}:
        - template: ../templates/checkout-shallow.yml
          parameters:
            persistCredentials: true

        # Use the checkout OAuth token for authenticated GitHub API requests.
        - pwsh: |
            $headerLine = git config --get-regexp "http.*\.extraheader" 2>$null | Select-Object -First 1
            if (-not $headerLine) {
              Write-Host "##vso[task.logissue type=warning]No HTTP extraheader found; GitHub API requests will run without authentication"
              exit 0
            }
            $encoded = ($headerLine.Split(' ')[-1]).Trim()
            $decoded = [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String($encoded))
            $token = $decoded.Split(':')[-1]
            Write-Host "Extracted GitHub OAuth token (length=$($token.Length))"
            Write-Host "##vso[task.setvariable variable=GitHubOAuthToken;issecret=true]$token"
          displayName: Extract GitHub OAuth token

      - ${{ else }}:
        - template: ../templates/checkout-shallow.yml

      - template: ../templates/prepare-js-env.yml
        parameters:
          buildEnvironment: ${{ parameters.buildEnvironment }}

      - script: yarn format:verify
        displayName: yarn format:verify

      - script: yarn lint
        displayName: yarn lint
        ${{ if eq(parameters.buildEnvironment, 'Continuous') }}:
          env:
            PLATFORM_OVERRIDE_GITHUB_TOKEN: $(GitHubOAuthToken)

      # Disable while facebook/react-native -> react/react-native migration breaks CI
      # - script: yarn validate-overrides
      #  displayName: yarn validate-overrides
      #  ${{ if eq(parameters.buildEnvironment, 'Continuous') }}:
      #    env:
      #      PLATFORM_OVERRIDE_GITHUB_TOKEN: $(GitHubOAuthToken)

      # Link verification (unbroken) is disabled: it cannot run under network isolation.
      # - script: npx unbroken -q --local-only --allow-local-line-sections
      #   displayName: check local links in .md files
