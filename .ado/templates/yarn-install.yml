parameters:
- name: workingDirectory
  type: string
  default: .
- name: agentImage
  type: string
  default: ManagedImage
  values:
      - ManagedImage
      - HostedImage

steps:
  - task: UseNode@1
    inputs:
      version: '24.x'
    displayName: Use Node.js 24.x

  # TODO: REMOVE. Should be included in image.
  - task: CmdLine@2
    inputs:
      script: |
        npm install --global yarn@1.22.22 midgard-yarn@1.23.34 verdaccio@6.7.2
    displayName: Install Node base packages
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))

  - task: CmdLine@2
    inputs:
      script: |
        npm install --global yarn@1.22.22 midgard-yarn@1.23.34 verdaccio@6.7.2
    displayName: Install Node base packages
    condition: and(succeeded(), eq(variables['Build.Reason'], 'PullRequest'))
    env:
      NPM_CONFIG_REGISTRY: https://pkgs.dev.azure.com/ms/react-native/_packaging/react-native-public/npm/registry/

    # When using our own images, prefer the machine-installed version of
  # `midgard-yarn`.
  - ${{ if eq(parameters.agentImage, 'ManagedImage') }}:
    - script: midgard-yarn --ignore-scripts --frozen-lockfile --cwd ${{ parameters.workingDirectory }}
      displayName: midgard-yarn (faster yarn install)
      retryCountOnTaskFailure: 2

  # If using an image we don't control, acquire a fixed version of midgard-yarn
  # before install
  - ${{ else }}:
    - script: npx --yes midgard-yarn@1.23.34 --ignore-scripts --frozen-lockfile --cwd ${{ parameters.workingDirectory }}
      displayName: midgard-yarn (faster yarn install)
      retryCountOnTaskFailure: 2
      condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))

    - script: npx --yes midgard-yarn@1.23.34 --ignore-scripts --frozen-lockfile --cwd ${{ parameters.workingDirectory }}
      displayName: midgard-yarn (faster yarn install)
      retryCountOnTaskFailure: 2
      condition: and(succeeded(), eq(variables['Build.Reason'], 'PullRequest'))
      env:
        NPM_CONFIG_REGISTRY: https://pkgs.dev.azure.com/ms/react-native/_packaging/react-native-public/npm/registry/
