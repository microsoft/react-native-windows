#
parameters:
  - name: beachballPublish
    type: boolean
    default: true
  - name: buildEnvironment
    type: string
    default: PullRequest
    values:
      - PullRequest
      - Continuous

steps:
  - pwsh: |
      node .ado/verdaccio/generate-config.js
      if ($LASTEXITCODE -ne 0) { throw 'Failed to generate the verdaccio config.' }
      start-process verdaccio.cmd -ArgumentList @('--config', './.ado/verdaccio/config.generated.yaml')
    displayName: Launch test npm server (verdaccio)
    # Only CI has a feed token; an undefined variable would expand to a literal string.
    ${{ if eq(parameters.buildEnvironment, 'Continuous') }}:
      env:
        RNW_NPM_FEED_TOKEN: $(RNW_NPM_FEED_TOKEN)

  - script: node .ado/scripts/waitForVerdaccio.js
    displayName: Wait for verdaccio server to boot

  - script: node .ado/scripts/npmAddUser.js user pass mail@nomail.com http://localhost:4873
    displayName: Add npm user to verdaccio

  - template: compute-beachball-branch-name.yml

  - ${{ if eq(parameters.beachballPublish, true) }}:
    - pwsh: npx beachball bump --branch "origin/$env:BEACHBALL_BRANCH" --no-push --yes --verbose --changehint "Run 'yarn change' from root of repo to generate a change file."
      displayName: Beachball bump versions
      env:
        BEACHBALL_BRANCH: $(BeachBallBranchName)

    - script: node .ado/scripts/npmPack.js --clean --no-color
      displayName: Pack all workspace packages

    - script: node .ado/scripts/npmPack.js --no-pack --check-npm --no-color
      displayName: Remove already published packages

    - script: |
        for %%f in (npm-pkgs\*.tgz) do (
          echo Publishing %%f to verdaccio...
          npm publish "%%f" --registry http://localhost:4873 --access public --tag canary
        )
      displayName: Publish packages to verdaccio
    
  - script: | 
      call npm config set registry http://localhost:4873
      call yarn config set npmRegistryServer http://localhost:4873
      call yarn config set unsafeHttpWhitelist --json "[\"localhost\"]"
    displayName: Modify npm/yarn config to point to local verdaccio server
    env:
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
