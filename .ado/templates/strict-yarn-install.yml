parameters:
- name: workspace
  type: string
  default: react-native-windows-repo

steps:
  # Remove postinstall to avoid running build during install
  - pwsh: |
      $packageJson = Get-Content ./package.json | ConvertFrom-Json
      $packageJson.scripts = $packageJson.scripts | Select-Object * -ExcludeProperty postinstall
      $packageJson | ConvertTo-Json | Out-File ./package.json
    displayName: Remove postinstall

  - task: UseNode@1
    inputs:
      version: '24.x'
    displayName: Use Node.js 24.x

  # Must run before any package is fetched so nothing is pulled from npmjs.org directly.
  - template: configure-npm-feed.yml

  # TODO: REMOVE. Should be included in image.
  - task: CmdLine@2
    inputs:
      script: |
        npm install --global yarn@1.22.22 midgard-yarn@1.23.34 verdaccio@6.7.2
    displayName: Install Node base packages

  - script: yarn install --immutable
    displayName: Strict yarn install ${{ parameters.workspace }}
    retryCountOnTaskFailure: 2
    env:
      YARN_NPM_REGISTRY_SERVER: $(npmFeedRegistry)
      YARN_NPM_ALWAYS_AUTH: 'true'
      YARN_NPM_AUTH_TOKEN: $(npmFeedAuthToken)
