#
# The Release pipeline entry point.
# It publishes npm and NuGet packages to their public registries (npmjs.com and
# nuget.org) and mirrors both into the ms/react-native-public and ms/react-native
# ADO feeds, plus PDB symbols to the Microsoft Symbol Server.
#
# This file supersedes the removed release.yml and consumes the CI pipeline
# (project ISS, source microsoft.react-native-windows.ci).
#
# The pipeline completion trigger is defined below in the pipeline resource.
# Do NOT add a build completion trigger in the ADO UI — UI triggers override
# YAML triggers and cause the pipeline to always run against the default branch
# with incorrect metadata (wrong commit message and branch).
#

name: RNW Release $(Date:yyyyMMdd).$(Rev:r)

trigger: none
pr: none

parameters:
  - name: forceRelease
    displayName: 'Force release (override CI flag — emergency use only)'
    type: boolean
    default: false
  # Single source for the identity used to publish npm and NuGet to the ADO feeds.
  - name: adoFeedServiceConnection
    displayName: 'ADO feed publish identity (Azure service connection)'
    type: string
    default: 'Office-Hermes-Windows-Bot'

variables:
  # Only npm call is the publish-eligibility check (npm view) in PushNpm; keep it on the compliant feed.
  - name: NPM_CONFIG_REGISTRY
    value: https://pkgs.dev.azure.com/ms/react-native/_packaging/react-native-public/npm/registry/

resources:
  pipelines:
  - pipeline: 'CI'
    project: 'ISS'
    source: 'microsoft.react-native-windows.ci'
    trigger:
      branches:
        include:
        - main
        - '0.81-stable'
        - '0.82-stable'
        - '0.83-stable'
        - '0.84-stable'
        - '0.85-stable'
        - '0.86-stable'
        - '0.87-stable'
  repositories:
  - repository: OfficePipelineTemplates
    type: git
    name: 1ESPipelineTemplates/OfficePipelineTemplates
    ref: refs/tags/release

extends:
  template: v1/Office.Official.PipelineTemplate.yml@OfficePipelineTemplates
  parameters:
    pool:
      name: Azure-Pipelines-1ESPT-ExDShared
      vmImage: windows-latest
      os: windows
    sdl:
      # Release only publishes artifacts; disable analyzers that would only see build scripts/tests.
      bandit:
        enabled: false
      eslint:
        enableExclusions: true
      suppression:
        suppressionFile: $(Build.SourcesDirectory)\.ado\guardian\sdl\.gdnsuppress
    settings:
      # Report-only network isolation so nuget.org publishing can egress (Enforce blocks it).
      networkIsolationMode: Audit
    stages:
    #
    # Gate stage — runs unconditionally for every trigger.
    # It determines whether the Release stage should proceed and sets a
    # descriptive build number so the pipeline history is easy to scan.
    #
    - stage: Gate
      displayName: Evaluate release
      jobs:
      - job: Evaluate
        displayName: Check if release should proceed
        templateContext:
          inputs:
          - input: pipelineArtifact
            pipeline: 'CI'
            artifactName: 'VersionEnvVars'
            targetPath: '$(Pipeline.Workspace)/VersionEnvVars'
        steps:
        - checkout: none

        # Apply version variables from the CI artifact (sets IsReleaseBuild, npmVersion, etc.)
        - task: CmdLine@2
          displayName: Apply CI version variables
          inputs:
            script: node $(Pipeline.Workspace)/VersionEnvVars/versionEnvVars.js

        - pwsh: |
            $forceRelease = '${{ parameters.forceRelease }}'
            $isReleaseBuild = $env:IS_RELEASE_BUILD
            $ciRunName = $env:CI_RUN_NAME
            $sourceBranch = $env:SOURCE_BRANCH -replace '^refs/heads/', ''

            # Extract the datestamp (e.g. "20260319.4") from the original build number
            # which has the format "RNW Release 20260319.4"
            $originalBuildNumber = $env:BUILD_BUILDNUMBER
            $dateStamp = if ($originalBuildNumber -match '(\d{8}\.\d+)$') { $Matches[1] } else { "" }

            # Fallback: if IsReleaseBuild is not in the CI artifact (old branches),
            # fall back to commit message detection for backward compatibility.
            if (-not $isReleaseBuild) {
              $sourceMessage = ($env:SOURCE_MESSAGE -split "`n")[0].Trim()
              $isReleaseBuild = if ($sourceMessage.StartsWith("RELEASE:")) { 'True' } else { 'False' }
              Write-Host "##[warning]IsReleaseBuild not found in CI artifact, fell back to commit message detection: $isReleaseBuild"
            }

            Write-Host "isReleaseBuild (from CI): $isReleaseBuild"
            Write-Host "forceRelease (param):     $forceRelease"

            $shouldRelease = $false
            $buildNumber = ""

            if ($forceRelease -eq 'True') {
              # Emergency override — allow publishing regardless of CI flag
              $shouldRelease = $true
              if ($ciRunName) {
                $buildNumber = "$ciRunName [FORCED] ($sourceBranch) - $dateStamp"
              } else {
                $buildNumber = "Release [FORCED] ($sourceBranch) - $dateStamp"
              }
              Write-Host "##[warning]Release forced by parameter override"
            }
            elseif ($isReleaseBuild -eq 'True') {
              $shouldRelease = $true
              if ($ciRunName) {
                $buildNumber = "$ciRunName ($sourceBranch) - $dateStamp"
              } else {
                $buildNumber = "Release ($sourceBranch) - $dateStamp"
              }
            }
            else {
              $shouldRelease = $false
              # Truncate commit message for readability
              $shortMsg = ($env:SOURCE_MESSAGE -split "`n")[0].Trim()
              if ($shortMsg.Length -gt 60) {
                $shortMsg = $shortMsg.Substring(0, 57) + "..."
              }
              $buildNumber = "Skipped - $shortMsg ($sourceBranch) - $dateStamp"
            }

            # Sanitize: ADO build numbers cannot contain " / : < > \ | ? @ *
            # and cannot end with '.'
            $buildNumber = $buildNumber -replace '["/:<>\\|?@*]', '_'
            $buildNumber = $buildNumber.TrimEnd('.')

            Write-Host "shouldRelease: $shouldRelease"
            Write-Host "buildNumber:   $buildNumber"

            Write-Host "##vso[build.updatebuildnumber]$buildNumber"
            Write-Host "##vso[task.setvariable variable=shouldRelease;isOutput=true]$shouldRelease"
          name: gate
          displayName: Determine release eligibility from CI artifact
          env:
            BUILD_BUILDNUMBER: $(Build.BuildNumber)
            IS_RELEASE_BUILD: $(IsReleaseBuild)
            CI_RUN_NAME: $(resources.pipeline.CI.runName)
            SOURCE_BRANCH: $(resources.pipeline.CI.sourceBranch)
            SOURCE_MESSAGE: $(Build.SourceVersionMessage)

        - script: echo Proceeding with release
          displayName: RELEASING - proceeding to publish
          condition: eq(variables['gate.shouldRelease'], 'True')

        - script: echo Skipping release
          displayName: SKIPPED - not a release build
          condition: eq(variables['gate.shouldRelease'], 'False')

    - stage: Release
      displayName: Publish artifacts
      dependsOn: Gate
      condition: eq(dependencies.Gate.outputs['Evaluate.gate.shouldRelease'], 'True')
      jobs:
      - job: PushNpm
        displayName: npmjs.com - Publish npm packages
        timeoutInMinutes: 30
        templateContext:
          type: releaseJob
          isProduction: true
          inputs:
          - input: pipelineArtifact
            pipeline: 'CI'
            artifactName: 'NpmPackedTarballs'
            targetPath: '$(Pipeline.Workspace)/published-packages'
          - input: pipelineArtifact
            pipeline: 'CI'
            artifactName: 'VersionEnvVars'
            targetPath: '$(Pipeline.Workspace)/VersionEnvVars'
        steps:
        - task: CmdLine@2
          displayName: Apply version variables
          inputs:
            script: node $(Pipeline.Workspace)/VersionEnvVars/versionEnvVars.js
        - script: dir /s "$(Pipeline.Workspace)\published-packages"
          displayName: Show npm packages before cleanup
        - script: node "$(Pipeline.Workspace)\VersionEnvVars\npmPack.js" --no-pack --check-npm --no-color "$(Pipeline.Workspace)\published-packages"
          displayName: Remove already published packages
        - script: dir /s "$(Pipeline.Workspace)\published-packages"
          displayName: Show npm packages after cleanup
        - pwsh: |
            $tgzFiles = Get-ChildItem -Path "$(Pipeline.Workspace)\published-packages" -Filter "*.tgz" -Recurse
            $tgzCount = $tgzFiles.Count
            Write-Host "Found $tgzCount .tgz files"
            Write-Host "##vso[task.setvariable variable=HasPackagesToPublish]$($tgzCount -gt 0)"
          displayName: Check if there are packages to publish
        - task: 'EsrpRelease@11'
          displayName: 'ESRP Release to npmjs.com'
          condition: and(succeeded(), ne(variables['NpmDistTag'], ''), eq(variables['HasPackagesToPublish'], 'true'))
          inputs:
            connectedservicename: 'ESRP-JSHost3'
            usemanagedidentity: false
            keyvaultname: 'OGX-JSHost-KV'
            authcertname: 'OGX-JSHost-Auth4'
            signcertname: 'OGX-JSHost-Sign3'
            clientid: '0a35e01f-eadf-420a-a2bf-def002ba898d'
            domaintenantid: 'cdc5aeea-15c5-4db6-b079-fcadd2505dc2'
            contenttype: npm
            folderlocation: '$(Pipeline.Workspace)\published-packages'
            productstate: '$(NpmDistTag)'
            owners: 'vmorozov@microsoft.com'
            approvers: 'khosany@microsoft.com'

      - job: PushNpmPublicAdo
        displayName: ADO - npm - react-native-public
        timeoutInMinutes: 30
        templateContext:
          type: releaseJob
          isProduction: true
          inputs:
          - input: pipelineArtifact
            pipeline: 'CI'
            artifactName: 'NpmPackedTarballs'
            targetPath: '$(Pipeline.Workspace)/npm-feed-packages'
          - input: pipelineArtifact
            pipeline: 'CI'
            artifactName: 'VersionEnvVars'
            targetPath: '$(Pipeline.Workspace)/VersionEnvVars'
        steps:
        - template: .ado/templates/publish-npm-to-ado-feed.yml@self
          parameters:
            azureSubscription: ${{ parameters.adoFeedServiceConnection }}
            npmFeedRegistry: 'https://pkgs.dev.azure.com/ms/react-native/_packaging/react-native-public/npm/registry/'
            packagesPath: '$(Pipeline.Workspace)/npm-feed-packages'
            feedDisplayName: 'ms/react-native-public'

      - job: PushNpmPrivateAdo
        displayName: ADO - npm - react-native
        timeoutInMinutes: 30
        templateContext:
          type: releaseJob
          isProduction: true
          inputs:
          - input: pipelineArtifact
            pipeline: 'CI'
            artifactName: 'NpmPackedTarballs'
            targetPath: '$(Pipeline.Workspace)/npm-feed-packages'
          - input: pipelineArtifact
            pipeline: 'CI'
            artifactName: 'VersionEnvVars'
            targetPath: '$(Pipeline.Workspace)/VersionEnvVars'
        steps:
        - template: .ado/templates/publish-npm-to-ado-feed.yml@self
          parameters:
            azureSubscription: ${{ parameters.adoFeedServiceConnection }}
            npmFeedRegistry: 'https://pkgs.dev.azure.com/ms/_packaging/react-native/npm/registry/'
            packagesPath: '$(Pipeline.Workspace)/npm-feed-packages'
            feedDisplayName: 'ms/react-native'

      - job: PushPrivateAdo
        displayName: ADO - nuget - react-native
        timeoutInMinutes: 30
        templateContext:
          type: releaseJob
          isProduction: true
          inputs:
          - input: pipelineArtifact
            pipeline: 'CI'
            artifactName: 'ReactWindows-final-nuget'
            targetPath: '$(Pipeline.Workspace)/ReactWindows-final-nuget'
        steps:
        - template: .ado/templates/publish-nuget-to-ado-feed.yml@self
          parameters:
            azureSubscription: ${{ parameters.adoFeedServiceConnection }}
            endpointId: 'cfe2ce40-0448-46a1-b36d-4205330ca275'
            nugetFeedUrl: 'https://pkgs.dev.azure.com/ms/_packaging/react-native/nuget/v3/index.json'
            packageParentPath: '$(Pipeline.Workspace)/ReactWindows-final-nuget'
            packagesToPush: '$(Pipeline.Workspace)/ReactWindows-final-nuget/*.nupkg'
            publishFeedCredentials: 'Nuget - ms/react-native'
            feedDisplayName: 'ms/react-native'

      - job: PushPublicAdo
        displayName: ADO - nuget - react-native-public
        timeoutInMinutes: 30
        templateContext:
          type: releaseJob
          isProduction: true
          inputs:
          - input: pipelineArtifact
            pipeline: 'CI'
            artifactName: 'ReactWindows-final-nuget'
            targetPath: '$(Pipeline.Workspace)/ReactWindows-final-nuget'
        steps:
        - template: .ado/templates/publish-nuget-to-ado-feed.yml@self
          parameters:
            azureSubscription: ${{ parameters.adoFeedServiceConnection }}
            endpointId: '29e4c04c-ae69-4453-b9f3-bfef7a4c8d32'
            nugetFeedUrl: 'https://pkgs.dev.azure.com/ms/react-native/_packaging/react-native-public/nuget/v3/index.json'
            packageParentPath: '$(Pipeline.Workspace)/ReactWindows-final-nuget'
            packagesToPush: '$(Pipeline.Workspace)/ReactWindows-final-nuget/*.nupkg'
            publishFeedCredentials: 'Nuget - ms/react-native-public'
            feedDisplayName: 'ms/react-native-public'

      - job: PushNuGetOrg
        displayName: nuget.org - Push nuget packages
        timeoutInMinutes: 30
        templateContext:
          type: releaseJob
          isProduction: true
          inputs:
          - input: pipelineArtifact
            pipeline: 'CI'
            artifactName: 'ReactWindows-final-nuget'
            targetPath: '$(Pipeline.Workspace)/ReactWindows-final-nuget'
        steps:
        # nuget.org API key comes from OGX-JSHost-KV;
        - task: AzureKeyVault@2
          displayName: Fetch nuget.org API key from OGX-JSHost-KV
          inputs:
            azureSubscription: 'ESRP-JSHost3'
            KeyVaultName: 'OGX-JSHost-KV'
            SecretsFilter: 'OGX-JSHost-Nuget-org-API-key-Microsoft-JavaScript-NodeApi'

        # Pass the key through an env var into SetApiKey so it never appears on a
        # command line; the push below then needs no key argument.
        - pwsh: nuget.exe SetApiKey "$env:NUGET_API_KEY"
          displayName: NuGet SetApiKey (nuget.org)
          workingDirectory: $(Pipeline.Workspace)/ReactWindows-final-nuget
          env:
            NUGET_API_KEY: $(OGX-JSHost-Nuget-org-API-key-Microsoft-JavaScript-NodeApi)

        - script: dir /S "$(Pipeline.Workspace)\ReactWindows-final-nuget"
          displayName: Show directory contents

        # -SkipDuplicate treats an existing version (HTTP 409) as success and
        # fails on any other error, without reading package contents.
        - script: nuget.exe push .\Microsoft.ReactNative.*.nupkg -Source https://api.nuget.org/v3/index.json -SkipDuplicate -NoSymbol -NonInteractive -Verbosity Detailed
          displayName: NuGet push (nuget.org)
          workingDirectory: $(Pipeline.Workspace)/ReactWindows-final-nuget

      - job: PublishSymbols
        displayName: Publish PDB Symbols to Symbol Server
        timeoutInMinutes: 30
        templateContext:
          type: releaseJob
          isProduction: true
          inputs:
          - input: pipelineArtifact
            pipeline: 'CI'
            artifactName: 'ReactWindows-final-nuget'
            targetPath: '$(Pipeline.Workspace)/ReactWindows-final-nuget'
        steps:
        - pwsh: |
            # Extract PDB files from all NuGet packages (.nupkg are ZIP archives)
            $nugetDir = "$(Pipeline.Workspace)/ReactWindows-final-nuget"
            $symbolsDir = "$(Pipeline.Workspace)/symbols"
            New-Item -ItemType Directory -Path $symbolsDir -Force | Out-Null

            $nupkgs = Get-ChildItem "$nugetDir/*.nupkg"
            Write-Host "Found $($nupkgs.Count) NuGet packages"

            foreach ($nupkg in $nupkgs) {
              Write-Host "Extracting PDBs from: $($nupkg.Name)"
              $extractDir = "$symbolsDir/$($nupkg.BaseName)"
              # Rename to .zip for Expand-Archive compatibility
              $zipPath = "$nugetDir/$($nupkg.BaseName).zip"
              Copy-Item $nupkg.FullName $zipPath
              Expand-Archive -Path $zipPath -DestinationPath $extractDir -Force
              Remove-Item $zipPath
            }

            # Show extracted PDBs
            $pdbs = Get-ChildItem "$symbolsDir" -Recurse -Filter "*.pdb"
            Write-Host "`nFound $($pdbs.Count) PDB files:"
            foreach ($pdb in $pdbs) {
              Write-Host "  $($pdb.FullName) ($([math]::Round($pdb.Length / 1MB, 2)) MB)"
            }

            if ($pdbs.Count -eq 0) {
              Write-Host "##vso[task.logissue type=warning]No PDB files found in NuGet packages"
            }
          displayName: Extract PDBs from NuGet packages

        - template: .ado/templates/publish-symbols.yml@self
          parameters:
            symbolsArtifactName: 'ReactNativeWindows-Symbols-$(Build.BuildId)'
