# Disposable tag-authentication validation; no package builds or publishing.
name: RNW-tag-auth-$(Build.BuildId)

trigger: none
pr: none

resources:
  repositories:
  - repository: PipelineTemplates
    type: git
    name: 1ESPipelineTemplates/OfficePipelineTemplates
    ref: refs/tags/release

extends:
  template: v1/Office.Official.PipelineTemplate.yml@PipelineTemplates
  parameters:
    pool:
      name: fabric-internal-pool-large
      demands: ImageOverride -equals rnw-img-vs2026-node24
    featureFlags:
      autoEnablePREfastWithNewRuleset: false
    sdl:
      credscan:
        suppressionsFile: $(Build.SourcesDirectory)\.ado\config\CredScanSuppressions.json
      spotBugs:
        enabled: false
      prefast:
        enabled: false
      bandit:
        enabled: false
      eslint:
        enableExclusions: true
      suppression:
        suppressionFile: $(Build.SourcesDirectory)\.ado\guardian\sdl\.gdnsuppress
    stages:
    - stage: TagAuthValidation
      jobs:
      - job: RNWTagAuthValidation
        displayName: Validate GitHub tag credentials
        timeoutInMinutes: 15
        steps:
        - template: .ado/templates/checkout-shallow.yml@self
          parameters:
            persistCredentials: true

        - pwsh: |
            $ErrorActionPreference = 'Stop'
            $origin = git remote get-url origin
            if ($LASTEXITCODE -ne 0) { throw 'Could not resolve origin.' }
            if ($origin -notmatch '^https://github\.com/microsoft/react-native-windows(?:\.git)?/?$') {
              throw "Unexpected origin: $origin"
            }
            $gitOptions = @('-c', 'http.lowSpeedLimit=1', '-c', 'http.lowSpeedTime=30')
            $tag = "poc/rnw-tag-auth-$env:BUILD_BUILDID"
            $existing = git @gitOptions ls-remote --tags origin "refs/tags/$tag"
            if ($LASTEXITCODE -ne 0) { throw "Tag lookup failed for $tag" }
            if ($existing) { throw "Tag $tag already exists; refusing to change it." }

            git tag $tag $env:BUILD_SOURCEVERSION
            if ($LASTEXITCODE -ne 0) { throw "Tag creation failed for $tag" }
            $pushed = $false
            try {
              git @gitOptions push origin "refs/tags/$tag"
              if ($LASTEXITCODE -ne 0) { throw "Tag push failed for $tag" }
              $pushed = $true
              $remote = git @gitOptions ls-remote --tags origin "refs/tags/$tag"
              if ($LASTEXITCODE -ne 0) { throw "Tag verification failed for $tag" }
              if ($remote -ne "$($env:BUILD_SOURCEVERSION)`trefs/tags/$tag") {
                throw "Unexpected remote tag: $remote"
              }
              Write-Host "Verified GitHub tag $tag at $env:BUILD_SOURCEVERSION."
            } finally {
              if ($pushed) {
                git @gitOptions push origin ":refs/tags/$tag"
                if ($LASTEXITCODE -ne 0) { throw "Remote cleanup failed for $tag" }
                $remaining = git @gitOptions ls-remote --tags origin "refs/tags/$tag"
                if ($LASTEXITCODE -ne 0 -or $remaining) { throw "Tag $tag was not removed." }
                Write-Host "Verified disposable tag $tag was removed."
              }
              git tag -d $tag
              if ($LASTEXITCODE -ne 0) { throw "Local cleanup failed for $tag" }
            }
          displayName: Verify GitHub tag creation and cleanup
          timeoutInMinutes: 3
          env:
            GIT_TERMINAL_PROMPT: '0'
            GCM_INTERACTIVE: Never
