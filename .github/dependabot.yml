version: 2
registries:
  packagefeedproxy:
    type: npm-registry
    url: https://packagefeedproxy.microsoft.io/npm/
    replaces-base: true
  # PackageFeedProxy metadata advertises these anonymous tarball download hosts.
  # They do not replace the registry used to check for updates.
  npm-public-2:
    type: npm-registry
    url: https://ms-feed-2.pkgs.visualstudio.com/1es-public/_packaging/npm-public/npm/registry/
  npm-public-12:
    type: npm-registry
    url: https://ms-feed-12.pkgs.visualstudio.com/1es-public/_packaging/npm-public/npm/registry/
  npm-public-25:
    type: npm-registry
    url: https://ms-feed-25.pkgs.visualstudio.com/1es-public/_packaging/npm-public/npm/registry/
# Keep the existing 8-day cooldown aligned with npmMinimalAgeGate in .yarnrc.yml.
updates:
# main branch - all dependency updates (minor + patch), daily
- package-ecosystem: npm
  directory: "/"
  target-branch: "main"
  registries: ["*"]
  cooldown:
    default-days: 8
  groups:
    all-dependencies:
      patterns:
        - '*'
  ignore:
    # Filter majors before grouping; group update-types checks the latest version,
    # not the compatible version selected by lockfile-only.
    - dependency-name: "*"
      update-types:
        - "version-update:semver-major"
    # Keep the RN and React release lines selected by integration; manifests pin exact versions.
    - dependency-name: "react"
      update-types:
        - "version-update:semver-minor"
    - dependency-name: "react-native"
      update-types:
        - "version-update:semver-minor"
    - dependency-name: "react-test-renderer"
      update-types:
        - "version-update:semver-minor"
    - dependency-name: "@types/react"
      update-types:
        - "version-update:semver-minor"
    - dependency-name: "@types/react-dom"
      update-types:
        - "version-update:semver-minor"
  schedule:
    interval: daily
    time: "05:00"
    timezone: "America/Los_Angeles"
  labels:
  - dependencies
  versioning-strategy: lockfile-only
  commit-message:
    prefix: 📦
  open-pull-requests-limit: 5

# Stable branches - weekly cadence, 1 grouped PR at a time

# 0.81 branch
- package-ecosystem: npm
  directory: "/"
  target-branch: "0.81-stable"
  registries: ["*"]
  cooldown:
    default-days: 8
  groups:
    all-dependencies:
      patterns:
        - '*'
  ignore:
    - dependency-name: "*"
      update-types:
        - "version-update:semver-major"
    # Keep RN on 0.81.x and React/renderers/types on 19.1.x; manifests pin exact versions.
    - dependency-name: "react"
      update-types:
        - "version-update:semver-minor"
    - dependency-name: "react-native"
      update-types:
        - "version-update:semver-minor"
    - dependency-name: "react-test-renderer"
      update-types:
        - "version-update:semver-minor"
    - dependency-name: "@types/react"
      update-types:
        - "version-update:semver-minor"
    - dependency-name: "@types/react-dom"
      update-types:
        - "version-update:semver-minor"
  schedule:
    interval: weekly
    time: "05:00"
    timezone: "America/Los_Angeles"
  labels:
  - dependencies
  versioning-strategy: lockfile-only
  commit-message:
    prefix: "📦 [0.81]"
  open-pull-requests-limit: 1

# 0.85 branch
- package-ecosystem: npm
  directory: "/"
  target-branch: "0.85-stable"
  registries: ["*"]
  cooldown:
    default-days: 8
  groups:
    all-dependencies:
      patterns:
        - '*'
  ignore:
    - dependency-name: "*"
      update-types:
        - "version-update:semver-major"
    # Keep RN on 0.85.x and React/renderers/types on 19.2.x; manifests pin exact versions.
    - dependency-name: "react"
      update-types:
        - "version-update:semver-minor"
    - dependency-name: "react-native"
      update-types:
        - "version-update:semver-minor"
    - dependency-name: "react-test-renderer"
      update-types:
        - "version-update:semver-minor"
    - dependency-name: "@types/react"
      update-types:
        - "version-update:semver-minor"
    - dependency-name: "@types/react-dom"
      update-types:
        - "version-update:semver-minor"
  schedule:
    interval: weekly
    time: "05:00"
    timezone: "America/Los_Angeles"
  labels:
  - dependencies
  versioning-strategy: lockfile-only
  commit-message:
    prefix: "📦 [0.85]"
  open-pull-requests-limit: 1
- package-ecosystem: "github-actions"
  directory: "/"
  groups:
    github-actions:
      patterns: ["*"]
  schedule:
    interval: "weekly"
  cooldown:
    default-days: 7
